apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.deployment.replicas}}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.name }}
    spec:
      volumes:
      - name: znuny-articles
        {{- if eq .Values.statefulSet.isPersistent true }} 
        persistentVolumeClaim:
          claimName: {{ .Values.persistentVolumeClaim.app.name }}
        {{- else }}
        emptyDir: {}
        {{- end}}
      containers:
      - name: {{ .Values.deployment.name }}
        image: {{ .Values.deployment.image }}
        ports:
        - containerPort: {{ .Values.deployment.port }}
        envFrom:
        - secretRef:
            name: {{ .Values.secret.name }}
        volumeMounts:
        - name: znuny-articles
          mountPath: /opt/znuny/var/articles
