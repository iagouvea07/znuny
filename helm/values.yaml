namespace: default

deployment:
  name: znuny-app
  replicas: 1
  image: iagouvea/znuny:7.1
  port: 80
  isPersistent: false

statefulSet:
  name: znuny-db
  replicas: 1
  image: mariadb:10.6
  port: 3306
  isPersistent: false

secret:
  name: znuny-db-access
  stringData:  
    MARIADB_DATABASE: znuny
    MARIADB_USER: znuny
    MARIADB_HOST: znuny-db-svc
    MARIADB_PASSWORD: teste

service:
  db:
    name: znuny-db-svc
    port: 3306

  app:
    name: znuny-app-svc
    port: 80

persistentVolumeClaim:
  app:
    name: znuny-articles
    storageClass: persistent-storage
    
  db:
    name: mariadb-storage
    storageClass: persistent-storage

ingress:
  enabled: false
  name: znuny-ingress
  host: znuny.local
  ingressClass: traefik

gateway:
  enabled: true
  name: gateway
  namespace: kgateway-system
  hostname: znuny.local
  httproute:
    name: znuny-route

cronjob:
  name: znuny-daemon
  schedule: "* * * * *"

